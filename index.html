let activeClass=null;function book(id){const c=classes().find(c=>c.id===id);if(!c||!c.left||bookings.some(b=>b.id===id&&b.day===day&&b.store===store)){toast('该时段不可预约，请重新选择');return;}activeClass={...c,day,store};const w=wallet.find(w=>w.type===c.type&&w.store===store&&w.left>0);openSheet(`<h2>确认预约</h2><div class="summary"><span class="tag">${c.type}</span><h3 style="margin:12px 0">${c.title}</h3><p>9月${day}日 ${c.time} — ${c.end}</p><p class="small muted">${stores[store]} · ${c.coach}</p></div><h3>使用会员卡</h3>${w?`<div class="option selected">${icon('card')}<div class="grow"><strong>${w.type} ${w.total}次卡</strong><span class="small muted">可用 ${w.left} 次 · 本次冻结 1 次</span></div>${icon('check')}</div>`:`<div class="info">暂无适用于${stores[store]}的${c.type}次卡。其他门店或课型的卡不能用于本课程。</div>`}<p class="small muted" style="margin:16px 0">开课前24小时可免费取消并返还次数，到店核销后正式扣次。</p><button class="btn full" data-action="${w?'confirmbook':'getcard'}" data-value="${c.type}">${w?'确认预约 · 冻结 1 次':'选购'+c.type+'卡'}</button>`)}
let address={name:'林同学',phone:'13800000000',detail:'上海市静安区 示例路88号 2栋101室'};let addressBack=false;
function cartSheet(){openSheet(`<h2>购物车 <span class="muted small">${count()} 件</span></h2>${count()?Object.entries(cart).map(([i,n])=>`<div class="summary row"><div style="width:56px;height:64px;flex:none">${productArt(products[i].art)}</div><div class="grow"><h3>${products[i].name}</h3><div class="row between" style="flex-wrap:wrap"><strong>${money(products[i].price)}</strong><div class="qty"><button data-action="minus" data-id="${i}" aria-label="减少${products[i].name}">−</button><span>${n}</span><button data-action="cartplus" data-id="${i}" aria-label="增加${products[i].name}">+</button></div></div></div></div>`).join('')+`<div class="row between" style="margin:20px 0"><span>商品合计</span><strong class="price">${money(total())}</strong></div><button class="btn full" data-action="checkout">去结算 ${icon('arrow')}</button>`:`<div class="empty">${icon('bag')}<h3>还没有加入好物</h3><p>挑一件适合你的训练装备吧。</p></div><button class="btn full" data-action="goshop">去逛逛</button>`}`)}
function checkout(){const freight=total()>=299?0:12;openSheet(`<h2>确认订单</h2><button class="option" data-action="editaddress">${icon('pin')}<div class="grow"><strong>${escapeHTML(address.name)} ${escapeHTML(address.phone)}</strong><span class="small muted">${escapeHTML(address.detail)}</span></div>${icon('chevron')}</button><div class="summary">${Object.entries(cart).map(([i,n])=>`<div class="row between"><span>${products[i].name} × ${n}</span><strong>${money(products[i].price*n)}</strong></div>`).join('')}<div class="line"></div><div class="row between"><span class="muted">快递配送</span><span>${freight?money(freight):'包邮'}</span></div><div class="row between"><span>实付金额</span><strong class="price">${money(total()+freight)}</strong></div></div><div class="info">总部仓库发货 · 满 ¥299 包邮，不满收取 ¥12。</div><button class="btn full" style="margin-top:20px" data-action="paygoods">模拟微信支付 ${money(total()+freight)}</button>`)}
function bookingsSheet(){openSheet(`<h2>我的预约</h2><div class="booking-entry"><span class="tag">待上课 · 示例预约</span><h3 style="margin-top:12px">基础小班课</h3><p>9月12日 14:00 — 15:00</p><p class="small muted">静安旗舰店 · 已占用1次</p><button class="btn light" data-action="voucher">查看预约凭证</button></div>${bookings.map((b,i)=>`<div class="booking-entry"><span class="tag">预约成功</span><h3 style="margin-top:12px">${b.title}</h3><p>9月${b.day}日 ${b.time} — ${b.end}</p><p class="small muted">${stores[b.store]} · ${b.coach} · ${b.type}卡占用1次</p><button class="btn light" data-action="cancelbook" data-id="${i}">取消预约并返还次数</button></div>`).join('')}`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.id),v=b.dataset.value;switch(a){
case 'pageback':goBack();break;case 'nav':navigationStack.length=0;selectedCoach=null;page=i;render(true);break;case 'cards':page=1;render(true);break;case 'shop':case 'goshop':closeSheet();page=3;render(true);break;case 'close':closeSheet();break;
case 'stores':openSheet('<h2>选择你的训练场馆</h2><p class="muted"></p>'+stores.map((s,n)=>`<button class="option ${store===n?'selected':''}" data-action="setstore" data-id="${n}">${icon('pin')}<div class="grow"><strong>${s}</strong><span class="small muted">上海 · ${['静安区','徐汇区','浦东新区'][n]} · 10:00—22:00</span></div>${store===n?icon('check'):icon('chevron')}</button>`).join('')+'');break;
case 'setstore':store=i;closeSheet();render();toast('已切换至'+stores[store]);break;
case 'cardtype':cardType=v;render();break;case 'classtype':classType=v;render();break;case 'day':day=i;render();break;case 'category':category=v;render();break;
case 'buy':if(page===0)cardType='小班课';purchase(i);break;
case 'paycard':if(!$('#agreement').checked){toast('请先阅读并勾选使用说明');break;}wallet.push({type:cardType,left:i,frozen:0,total:i,store});walletIndex=wallet.length-1;orders.push({title:cardType+i+'次卡',price:Number(b.dataset.price),status:'已发卡'});render();openSheet(`<div class="success">${icon('check')}</div><div class="center"><h2>购卡成功</h2><p>模拟支付成功，${i}次${cardType}卡已到账。</p></div><div class="summary small">适用：${stores[store]} · ${cardType}<br>下一步，选择适合你的上课时间。</div><button class="btn full" data-action="gobook">去预约第一堂课</button>`);break;
case 'book':book(i);break;case 'getcard':cardType=v;page=1;closeSheet();render(true);break;case 'gobook':closeSheet();page=2;bookingMode='course';selectedCoach=null;render(true);break;
case 'confirmbook':{if(bookings.some(b=>b.id===activeClass.id&&b.day===activeClass.day&&b.store===activeClass.store)){toast('你已预约该时段');break;}const w=wallet.find(w=>w.type===activeClass.type&&w.store===activeClass.store&&w.left>0);if(!w){toast('没有可用次数');break;}w.left--;w.frozen++;bookings.push({...activeClass,w});render();openSheet(`<div class="success">${icon('check')}</div><div class="center"><h2>预约成功</h2><p>9月${activeClass.day}日 ${activeClass.time}<br>${activeClass.title} · ${activeClass.coach}<br>${stores[activeClass.store]}</p></div><div class="summary small">${activeClass.type}卡已冻结1次。<br>到店出示预约记录，由工作人员核销。</div><button class="btn full" data-action="bookings">查看我的预约</button>`);break;}
case 'bookings':bookingsSheet();break;case 'cancelbook':{const x=bookings.splice(i,1)[0];x.w.left++;x.w.frozen--;render();bookingsSheet();toast('预约已取消，已返还1次');break;}
case 'voucher':openSheet(`<h2>预约凭证</h2><div class="summary center"><div class="overline">BOOKING / DEMO</div><h1 style="margin:16px 0">ZX 0912 001</h1><p>林同学 · 基础小班课</p><p class="muted small">9月12日 14:00 · 静安旗舰店</p></div><p class="info">示例凭证。正式小程序将生成专属核销码，由门店工作人员核销。</p>`);break;
case 'date':openSheet('<h2>选择上课日期</h2><label>演示日期范围为9月18日至24日<input type="date" id="dateInput" min="2026-09-18" max="2026-09-24" value="2026-09-'+day+'"></label><button class="btn full" data-action="setdate">确认日期</button>');break;case 'setdate':{const d=$('#dateInput').value;if(d<'2026-09-18'||d>'2026-09-24'){toast('请选择9月18日至24日');break;}day=Number(d.slice(-2));closeSheet();render();break;}
case 'product':openSheet(`<h2>${products[i].name}</h2><div class="drawing" style="display:grid;place-items:center;padding:24px;background:var(--soft);border-radius:20px">${productArt(products[i].art)}</div><div class="price" style="margin:16px 0">${money(products[i].price)}</div><p>${products[i].desc}</p><p class="small muted" style="margin:12px 0 20px">为日常训练准备的实用装备。现货 · 快递配送 · 满¥299包邮。商品及参数为设计示例。</p><button class="btn full" data-action="adddetail" data-id="${i}">加入购物车</button>`);break;
case 'add':case 'adddetail':cart[i]=(cart[i]||0)+1;render();toast('已加入购物车');break;case 'cart':cartSheet();break;case 'minus':cart[i]--;if(!cart[i])delete cart[i];render();cartSheet();break;case 'cartplus':cart[i]++;render();cartSheet();break;case 'checkout':checkout();break;
case 'address':case 'editaddress':addressBack=a==='editaddress';openSheet(`<h2>收货地址</h2><label>收件人<input id="addrName" value="${escapeHTML(address.name)}" autocomplete="name"></label><label>手机号码<input id="addrPhone" value="${escapeHTML(address.phone)}" inputmode="tel" maxlength="11"></label><label>省市区与详细地址<textarea id="addrDetail" rows="3">${escapeHTML(address.detail)}</textarea></label><button class="btn full" style="margin-top:16px" data-action="saveaddress">保存地址</button>`);break;
case 'saveaddress':{const n=$('#addrName').value.trim(),p=$('#addrPhone').value.trim(),d=$('#addrDetail').value.trim();if(!n||!/^1\d{10}$/.test(p)||d.length<8){toast('请填写姓名、11位手机号和完整地址');break;}address={name:n,phone:p,detail:d};if(addressBack)checkout();else{closeSheet();toast('地址已保存');}break;}
case 'paygoods':orders.push({title:'训练装备 · '+count()+'件',price:total()+(total()>=299?0:12),status:'待发货'});cart={};render();openSheet(`<div class="success">${icon('check')}</div><div class="center"><h2>支付成功</h2><p>模拟支付成功，订单已创建。</p></div><div class="summary small">快递配送至：${escapeHTML(address.detail)}<br>发货后可在我的订单查看运单信息。</div><button class="btn full" data-action="orders">查看订单</button>`);break;
case 'searchclear':query='';render();$('#searchInput').focus();break;case 'switchwallet':walletIndex=(walletIndex+1)%wallet.length;render();break;
case 'orders':openSheet('<h2>我的订单</h2>'+(orders.length?orders.map(o=>`<div class="summary"><div class="row between"><h3>${o.title}</h3><span class="tag">${o.status}</span></div><div class="price" style="margin-top:16px">${money(o.price)}</div></div>`).join(''):`<div class="empty">${icon('receipt')}<h3>还没有新的订单</h3><p>购买会员卡或商品后，将在这里展示。</p></div>`));break;
case 'group':openSheet(`<h2>拼团</h2><div class="group"><span class="tag">2人成团 · 新人体验</span><h1 style="margin:16px 0">双人体验计划</h1><div class="price">¥99 <small>/ 人</small></div><p class="small muted" style="margin-top:12px">每人1次小班体验课 · ${stores[store]}</p></div><div class="summary small">支付后进入待成团，24小时内成团后发放体验权益。成团后另行预约；未成团将发起退款。以上为示例规则。</div><button class="btn full" data-action="paygroup">模拟支付 ¥99 并开团</button>`);break;
case 'paygroup':groupJoined=true;orders.push({title:'双人体验拼团',price:99,status:'待成团'});openSheet(`<div class="success">${icon('team')}</div><div class="center"><h2>开团成功</h2><p>已开团 · 1 / 2人<br>邀请朋友，一起迈出第一步。</p></div><div class="summary small">成团后发放体验权益，再单独预约上课。原型不会生成真实拼团链接。</div><button class="btn full" data-action="sharepreview">预览邀请卡片</button>`);break;
case 'sharepreview':openSheet(`<h2>邀请卡片预览</h2><div class="hero"><div class="art">${targetArt}</div><span class="tag dark">来自林同学的邀请</span><h1>找个时间<br>一起专注。</h1><p>XX · 双人体验 ¥99 / 人</p></div>`);break;
case 'mygroup':if(groupJoined){openSheet('<h2>我的拼团</h2><div class="summary"><span class="tag">待成团 · 1 / 2 人</span><h3 style="margin:12px 0">好友双人体验计划</h3><p>待好友参加，成团后发放体验权益。</p><button class="btn full" style="margin-top:16px" data-action="sharepreview">预览邀请卡片</button></div>');}else{openSheet('<h2>我的拼团</h2><div class="empty">还没有参加拼团</div><button class="btn full" data-action="group">看看新人体验计划</button>');}break;
case 'coach':coachList();break;case 'coachslots':coachSlots(i);break;case 'coachday':day=i;render();break;case 'bookingmode':navigationStack.length=0;bookingMode=v;selectedCoach=null;render(true);break;case 'coachtype':coachType=v;coachLimit=6;render();break;case 'morecoaches':coachLimit+=6;render();break;case 'clearcoach':coachQuery='';coachLimit=6;render();$('#coachSearch').focus();break;case 'resetcoaches':coachQuery='';coachType='全部';coachLimit=6;render();break;
case 'rules':openSheet('<h2>会员卡使用说明</h2><div class="stack"><p>1. 每张卡仅用于对应课型，不能跨课型使用。</p><p>2. 仅限本人使用，适用于购卡门店。</p><p>3. 10次卡90天、50次卡365天，示例采用购买当天起算。</p><p>4. 预约时冻结次数，到店核销后正式扣次。</p><p>5. 退卡、延期、临时取消等实际政策待场馆确认。</p></div>');break;
case 'contact':openSheet('<h2>联系场馆</h2><div class="summary"><h3>'+stores[store]+'</h3><p style="margin-top:12px">服务时间 10:00 — 22:00</p><p class="small muted">正式版接入微信客服和门店联系电话。</p></div><p>预约、会员卡或商品问题，都可以向场馆咨询。</p>');break;
case 'ledger':openSheet('<h2>课时使用记录</h2>'+wallet.map(w=>`<div class="summary"><h3>${w.type} ${w.total}次卡</h3><div class="row between"><span>可用次数</span><strong>${w.left}</strong></div><div class="row between"><span>预约占用</span><strong>${w.frozen}</strong></div></div>`).join(''));break;
case 'profile':openSheet('<h2>个人资料</h2><div class="summary"><div class="row between"><span>昵称</span><span>林同学</span></div><div class="row between"><span>手机号</span><span>138 **** 0000</span></div><div class="row between"><span>学员类型</span><span>成人学员</span></div></div>');break;
}});
document.addEventListener('input',e=>{if(e.target.id==='coachSearch'){coachQuery=e.target.value;coachLimit=6;const pos=e.target.selectionStart;render();$('#coachSearch').focus();$('#coachSearch').setSelectionRange(pos,pos);}if(e.target.id==='searchInput'){query=e.target.value;const pos=e.target.selectionStart;render();$('#searchInput').focus();$('#searchInput').setSelectionRange(pos,pos);}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const f=[...$('.sheet').querySelectorAll('button,input,textarea,a')].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#appbrand').innerHTML=icon('target')+'XX射击俱乐部';const initial=Number(new URLSearchParams(location.search).get('page'));if(initial>=0&&initial<5)page=initial;render();
</script></body></html>
